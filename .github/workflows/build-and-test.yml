name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}-${{matrix.dotnet}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]
        dotnet: [ "8.0", "9.0", "10.0" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --framework net${{ matrix.dotnet }}

      - name: Test
        run: dotnet test --no-restore --framework net${{ matrix.dotnet }}

      - name: Publish
        run: dotnet publish src/ConventionalChangelog/ConventionalChangelog.csproj --framework net${{ matrix.dotnet }} --configuration
          Release --output release --nologo

      - name: Upload Build Artifact
        if: matrix.dotnet == '10.0'
        uses: actions/upload-artifact@v4
        with:
          name: Tool_${{ matrix.os }}
          path: release
